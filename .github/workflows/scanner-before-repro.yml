name: Alpha 3 scanner crash reproduction

on:
  push:
    branches: [alpha3-scanner-repro]

jobs:
  reproduce:
    name: API ${{ matrix.api }} scanner disposal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Reproduce Alpha 3 scanner shutdown race
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back emulated
          script: |
            ./gradlew :pccontrol2:assembleDebug :pccontrol2:assembleDebugAndroidTest --stacktrace
            adb install -r pccontrol2/build/outputs/apk/debug/pccontrol2-debug.apk
            adb install -r pccontrol2/build/outputs/apk/androidTest/debug/pccontrol2-debug-androidTest.apk
            adb logcat -c
            set +e
            adb shell am instrument -w -e class com.mggx.pccontrol.next.ScannerLifecycleReproTest com.mggx.pccontrol.next.test/androidx.test.runner.AndroidJUnitRunner | tee scanner-instrumentation-api${{ matrix.api }}.txt
            TEST_EXIT=$?
            sleep 5
            adb logcat -d -v threadtime > scanner-logcat-api${{ matrix.api }}.txt
            grep -n -A100 -B30 -E 'FATAL EXCEPTION|RejectedExecutionException|AndroidRuntime|ImageAnalysis' scanner-logcat-api${{ matrix.api }}.txt || true
            exit $TEST_EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha3-scanner-repro-api${{ matrix.api }}
          path: |
            scanner-instrumentation-api${{ matrix.api }}.txt
            scanner-logcat-api${{ matrix.api }}.txt
          if-no-files-found: warn
