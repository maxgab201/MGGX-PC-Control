name: Android CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Configure stable signing when repository secrets exist
        env:
          MGGX_KEYSTORE_BASE64: ${{ secrets.MGGX_KEYSTORE_BASE64 }}
          MGGX_KEYSTORE_PASSWORD: ${{ secrets.MGGX_KEYSTORE_PASSWORD }}
          MGGX_KEY_ALIAS: ${{ secrets.MGGX_KEY_ALIAS }}
          MGGX_KEY_PASSWORD: ${{ secrets.MGGX_KEY_PASSWORD }}
        run: |
          if [ -n "$MGGX_KEYSTORE_BASE64" ] && [ -n "$MGGX_KEYSTORE_PASSWORD" ] && [ -n "$MGGX_KEY_ALIAS" ] && [ -n "$MGGX_KEY_PASSWORD" ]; then
            printf %s "$MGGX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mggx-pc-control.jks"
            {
              echo "storeFile=$RUNNER_TEMP/mggx-pc-control.jks"
              echo "storePassword=$MGGX_KEYSTORE_PASSWORD"
              echo "keyAlias=$MGGX_KEY_ALIAS"
              echo "keyPassword=$MGGX_KEY_PASSWORD"
            } > signing.properties
            echo "SIGNING_PERSISTENCE=verified" >> "$GITHUB_ENV"
          else
            echo "SIGNING_PERSISTENCE=blocked: required GitHub Actions secrets are absent" >> "$GITHUB_ENV"
          fi
      - name: Unit tests
        run: |
          ./gradlew clean --stacktrace
          ./gradlew test --stacktrace
      - name: Lint and build
        run: |
          ./gradlew lint --stacktrace
          ./gradlew assembleDebug --stacktrace
      - name: Prepare universal APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          NEXT_APK=pccontrol2/build/outputs/apk/debug/pccontrol2-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          test -x "$APKSIGNER"
          cp "$APK" MGGX-PC-Control-universal-debug-v1.0.2.apk
          cp "$NEXT_APK" MGGX-PC-Control-2-alpha4-universal-debug.apk
          sha256sum MGGX-PC-Control-universal-debug-v1.0.2.apk MGGX-PC-Control-2-alpha4-universal-debug.apk > SHA256SUMS.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$NEXT_APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$NEXT_APK" | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}')
          test -n "$CERT_SHA256"
          if [ -n "${{ secrets.MGGX_EXPECTED_CERT_SHA256 }}" ]; then test "$CERT_SHA256" = "${{ secrets.MGGX_EXPECTED_CERT_SHA256 }}"; fi
          {
            echo "certificate_sha256=$CERT_SHA256"
            echo "signing_persistence=$SIGNING_PERSISTENCE"
            echo "two_build_signature_test=not_run_in_this_workflow"
          } > SIGNING_STATUS.txt
      - name: Publish MGGX PC Control 2 Alpha 4 release
        if: github.ref == 'refs/heads/pc-control-2-alpha'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'EOF'
          - Corrige el crash loop al iniciar el servicio del celular de casa.
          - Inicialización del servicio protegida y errores visibles en la aplicación.
          - CameraX se desvincula antes de cerrar el scanner para evitar frames sobre un executor finalizado.
          - Restauración acotada, sin reinicios START_STICKY infinitos.
          - Compatible con MGGX PC Agent 1.1.
          EOF
          )
          if gh release view v2.0.0-alpha4 >/dev/null 2>&1; then
            gh release edit v2.0.0-alpha4 --title "MGGX PC Control 2 — Alpha 4" --notes "$NOTES"
          else
            gh release create v2.0.0-alpha4 --target "$GITHUB_SHA" --title "MGGX PC Control 2 — Alpha 4" --notes "$NOTES" --prerelease
          fi
          gh release upload v2.0.0-alpha4 MGGX-PC-Control-2-alpha4-universal-debug.apk SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: MGGX-PC-Control-2-alpha4-universal-debug
          path: |
            MGGX-PC-Control-universal-debug-v1.0.2.apk
            MGGX-PC-Control-2-alpha4-universal-debug.apk
            SHA256SUMS.txt
            SIGNING_STATUS.txt
          if-no-files-found: error
