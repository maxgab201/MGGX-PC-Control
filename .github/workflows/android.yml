name: Android CI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build, test and lint
        run: |
          ./gradlew clean --stacktrace
          ./gradlew test --stacktrace
          ./gradlew lint --stacktrace
          ./gradlew assembleDebug --stacktrace
      - name: Prepare universal APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MGGX-PC-Control-universal-debug.apk
          sha256sum MGGX-PC-Control-universal-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MGGX-PC-Control-universal-debug
          path: |
            MGGX-PC-Control-universal-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
